<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMERSNET - Live Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
        }
        nav a:hover, nav a.active {
            color: var(--accent-color);
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            color: var(--accent-color);
        }
        .chat-section {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 20px;
        }
        .chat-box {
            height: 300px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
        .chat-input-area button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #0b1120;
            color: var(--text-muted);
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ GAMERSNET</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News & Feed</a>
            <a href="chat.html" class="active">Live Chat</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Gamer Community Chat Room</h2>
        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div><strong>System:</strong> Welcome to the GAMERSNET chat room! Say hello to online players.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message..." />
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GAMERSNET Hub</p>
    </footer>

    <script>
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            if (input.value.trim() === '') return;

            const msg = document.createElement('div');
            msg.innerHTML = `<strong style="color:#38bdf8;">Gamer:</strong> ${input.value}`;
            chatBox.appendChild(msg);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
