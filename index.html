<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMERSNET - Home</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-card: #0c0d14;
            --border-glow: #1f2235;
            --neon-cyan: #00f0ff;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--neon-cyan); text-decoration: none; }
        nav a { color: var(--text-muted); margin-left: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover, nav a.active { color: var(--neon-cyan); }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .panel { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        textarea, input { width: 100%; padding: 12px; background: #050508; border: 1px solid var(--border-glow); color: white; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        .action-btn { background: var(--neon-cyan); color: var(--bg-deep); border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .media-preview { max-width: 100%; border-radius: 6px; margin-top: 8px; max-height: 200px; display: block; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">GAMERSNET</a>
        <nav>
            <a href="index.html" class="active">Feed</a>
            <a href="news.html">News</a>
            <a href="chats.html">Chats</a>
        </nav>
    </header>

    <div class="container">
        <div class="panel">
            <h2>Broadcast & Share Media</h2>
            <textarea id="postContent" placeholder="What's your legendary gaming moment today?"></textarea>
            <input type="file" id="mediaInput" accept="image/*,video/*">
            <button class="action-btn" onclick="createPost()">Publish Post</button>
        </div>

        <div class="panel">
            <h2>Global Feed</h2>
            <div id="feedContainer"><p style="color:var(--text-muted);">Loading community posts...</p></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBLjm_Fm3rf6xArbVQm8NsHeMZAQAtYho8",
          authDomain: "gamersnet-b9c7d.firebaseapp.com",
          projectId: "gamersnet-b9c7d",
          storageBucket: "gamersnet-b9c7d.firebasestorage.app",
          messagingSenderId: "706719567863",
          appId: "1:706719567863:web:6bff33772a52af925368f2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        getRedirectResult(auth).catch((e) => console.error(e));

        window.createPost = async function() {
            const content = document.getElementById('postContent').value;
            const fileInput = document.getElementById('mediaInput');
            const user = auth.currentUser;
            if(!user) { alert("Please sign in first via Google!"); signInWithRedirect(auth, provider); return; }
            if(!content && fileInput.files.length === 0) return;

            let mediaUrl = fileInput.files.length > 0 ? URL.createObjectURL(fileInput.files[0]) : "";
            try {
                await addDoc(collection(db, "posts"), {
                    name: user.displayName,
                    text: content,
                    media: mediaUrl,
                    mediaType: fileInput.files.length > 0 ? fileInput.files[0].type : "",
                    timestamp: Date.now()
                });
                document.getElementById('postContent').value = '';
                fileInput.value = '';
                loadFeed();
            } catch(e) { console.error(e); }
        };

        async function loadFeed() {
            const feedContainer = document.getElementById('feedContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                feedContainer.innerHTML = "";
                if(querySnapshot.empty) { feedContainer.innerHTML = "<p style='color:var(--text-muted);'>No posts found.</p>"; return; }
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    let mediaHtml = post.media ? (post.mediaType && post.mediaType.includes("video") ? `<video src="${post.media}" controls class="media-preview"></video>` : `<img src="${post.media}" class="media-preview">`) : "";
                    feedContainer.innerHTML += `
                        <div style="background:#050508; padding:12px; border-radius:6px; margin-top:10px; border:1px solid var(--border-glow);">
                            <strong style="color:var(--neon-cyan);">${post.name}</strong>
                            <p style="margin:6px 0 10px 0;">${post.text}</p>
                            ${mediaHtml}
                        </div>`;
                });
            } catch(e) { feedContainer.innerHTML = "<p style='color:var(--text-muted);'>Connect Firestore to view posts.</p>"; }
        }
        loadFeed();
    </script>
</body>
</html>
