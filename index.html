<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMERSNET - Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
        }
        nav a:hover, nav a.active {
            color: var(--accent-color);
        }
        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .hero {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            padding: 4rem 2rem;
            border-radius: 12px;
            color: #0f172a;
            text-align: center;
        }
        .auth-btn {
            background-color: #0f172a;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #0b1120;
            color: var(--text-muted);
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ GAMERSNET</a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="news.html">News & Feed</a>
            <a href="chat.html">Live Chat</a>
        </nav>
        <div id="authArea">
            <button class="auth-btn" onclick="signInWithGoogle()">Sign in with Google</button>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Welcome to GAMERSNET</h1>
            <p>Your ultimate interactive gaming social hub, community feed, and live news ticker.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GAMERSNET. Built with GitHub & Netlify.</p>
    </footer>

    <!-- Firebase SDK & Auth Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBLjm_Fm3rf6xArbVQm8NsHeMZAQAtYho8",
          authDomain: "gamersnet-b9c7d.firebaseapp.com",
          projectId: "gamersnet-b9c7d",
          storageBucket: "gamersnet-b9c7d.firebasestorage.app",
          messagingSenderId: "706719567863",
          appId: "1:706719567863:web:6bff33772a52af925368f2",
          measurementId: "G-M5F43GTGS2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.signInWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Login Error:", error);
            });
        };

        onAuthStateChanged(auth, (user) => {
            const authArea = document.getElementById('authArea');
            if (user) {
                authArea.innerHTML = `<span style="color:var(--text-main); font-weight:600;">Hi, ${user.displayName}</span>`;
            } else {
                authArea.innerHTML = `<button class="auth-btn" onclick="signInWithGoogle()">Sign in with Google</button>`;
            }
        });
    </script>
</body>
</html>
